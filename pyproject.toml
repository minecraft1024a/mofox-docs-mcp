[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mofox-docs-mcp"
version = "0.1.0"
description = "Neo-MoFox 官方文档 MCP 服务器：通过 Model Context Protocol 搜索与阅读 MoFox-Bot-Docs 文档"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "minecraft1024a" }]
requires-python = ">=3.10"
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "mofox",
  "neo-mofox",
  "docs",
  "documentation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/minecraft1024a/mofox-docs-mcp"
Documentation = "https://docs.mofox-sama.com"

[project.scripts]
mofox-docs-mcp = "mofox_docs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mofox_docs_mcp"]
